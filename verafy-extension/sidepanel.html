<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verafy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <span class="wordmark">Verafy</span>
    <button id="settings" class="icon-btn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4L10.7 6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <section class="score" id="score" aria-live="polite">
    <div class="score-row">
      <span class="score-num" id="scoreNum">&ndash;</span>
      <span class="score-of">/100</span>
    </div>
    <p class="score-label" id="scoreLabel">Truth score</p>
    <div class="strip" id="strip" role="img" aria-label="Verdict for each claim"></div>
    <p class="score-basis" id="scoreBasis">Check a page to see how its claims hold up against independent sources.</p>
  </section>

  <section class="actions">
    <button id="checkPage" class="primary">Check this page</button>
    <p class="hint">Or select any statement on a page, right-click, and choose <em>Check with Verafy</em>.</p>
  </section>

  <p class="status" id="status" role="status"></p>
  <div class="notice" id="notice" hidden></div>

  <p class="subject" id="subject" hidden></p>
  <ol class="claims" id="claims"></ol>

  <footer class="foot">
    The score reflects the evidence found for each claim, not certainty. Read the sources before relying on it.
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
